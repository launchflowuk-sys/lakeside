<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--
      HEAD TAG OWNERSHIP — read this before adding anything here.

      Only tags that are correct for EVERY url may live in this file. This head
      is shared by all 34 pages, so a page-specific tag here becomes a wrong
      tag on 33 of them.

      It cannot be worked around. On React 19, react-helmet-async v3 detects
      the version and becomes a passthrough: React's own metadata hoisting
      renders the per-page tags, and it does NOT dedupe them against tags
      already present in this file. So anything page-specific left here ends up
      as a second, contradicting copy on every page. (data-rh does nothing —
      that is Helmet's own bookkeeping attribute and Helmet is not running.)

      Therefore:
        - description, og:title, og:description, og:type, canonical and og:url
          are page-specific. They live in each page's <Helmet>, never here.
        - og:image, og:site_name and the twitter card tags are identical
          sitewide, so they live ONLY here — pages must not repeat them.
        - twitter:title / twitter:description are omitted deliberately; X falls
          back to og:title / og:description, which are correct per page.
        - robots is omitted deliberately: index, follow is the default anyway,
          and leaving it out lets the 404 page's noindex be the only robots
          directive on the page rather than a contradicting second one.

      <title> stays as the no-JS fallback. This is a client-rendered SPA, so a
      crawler that does not execute JS sees this file's head on every url — the
      real fix for that is prerendering the public routes, not more tags here.
    -->
    <title>Lakeside &amp; Purfleet Taxis Ltd | Thurrock's Trusted Taxi Company Since 1990</title>
    <meta property="og:image" content="https://lakesidetaxi.co.uk/opengraph.jpg" />
    <meta property="og:site_name" content="Lakeside & Purfleet Taxis Ltd" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lakesidetaxi.co.uk/opengraph.jpg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/images/hero-bg.webp" fetchpriority="high">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <!--
      IMPECCABLE DIRECTION CONTRACT — lakeside-taxis — pinned: "Apple style"
      THESIS: A local taxi firm presented with the confidence of a product page.
        Refuses the SEO-template arrangement: kicker + h2 + four identical
        emoji cards, repeated down the page.
      OWN-WORLD: Three grounds only (white / #f5f5f7 mist / #1d1d1f ink) paced
        in alternation. Large tight-tracked Schibsted Grotesk display. Soft-
        shouldered borderless cards with real offset depth. Drawn 1.5-stroke
        icons. Brand yellow as a fill carrying ink text, never as yellow text.
      STORY: A Thurrock local searching "taxis in Grays" understands within one
        viewport that this firm is local, has been since 1990, prices are fixed
        before travel — and requests a quote.
      FIRST VIEWPORT: Ink ground, full-bleed. Breadcrumb, then display-scale
        town/airport name. Lede beneath. Primary yellow quote button paired
        with quiet call and WhatsApp. Quote card visible at desktop right.
      FORM: Brief-pinned direction (beats the concept roll per new-work §49).
      FINISH: unreviewed and undocumented is unfinished; this build ends with
        the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
