# www -> apex. Two hostnames serving one page is a duplicate-content fault.
# 301 keeps the path and query. Must stay ahead of the default "_" server.
server {
    listen 80;
    server_name www.lakesidetaxi.co.uk;
    return 301 https://lakesidetaxi.co.uk$request_uri;
}

# Real client-side routes (keep in step with the <Route>s in
# artifacts/lakeside-taxis/src/App.tsx). Anything else gets a 404 STATUS with
# the same SPA shell, so the app still draws its own not-found page but Google
# no longer sees a 200 for made-up URLs. Dynamic ids (/blog/:slug, /quote/:ref)
# cannot be enumerated here, so those stay 200.
map $uri $spa_known_route {
    default 0;
    ~^/(?:about|contact|local-taxis|airport-transfers(?:/(?:heathrow|gatwick|stansted|luton|london-city|southend))?|corporate-accounts|become-a-driver|driver-application-received|school-runs|long-distance-travel|tilbury-cruise-terminal|areas-covered|areas/(?:grays|purfleet|chafford-hundred|tilbury|south-ockendon|aveley|west-thurrock|stanford-le-hope|corringham)|blog(?:/[^/]+)?|quote-request|thank-you|quote(?:/[^/]+)?|booking-confirmed(?:/[^/]+)?|privacy-policy|terms|cookie-policy|admin(?:/(?:login|leads(?:/[^/]+)?|booked|settings|corporate(?:/[^/]+)?|payment-links|driver-applications(?:/[^/]+)?|help))?)?/?$ 1;
}

# Home only: a canonical in the raw HTML for crawlers that do not run JS.
# index.html is shared by every page, so it cannot carry one itself.
map $request_uri $home_canonical {
    default "";
    ~^/(\?.*)?$ '<link rel="canonical" href="https://lakesidetaxi.co.uk/" />';
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* to the API container. Uses the unique network alias
    # "lakeside-taxis-api", not the bare "api" hostname — this container is
    # also on the shared Traefik-facing network alongside other apps, and a
    # generic name like "api" is not guaranteed to resolve to this project's
    # own container there.
    location /api {
        # Driver applicants upload documents (licence, DBS, insurance) at up
        # to 10MB per file. nginx's default limit is 1MB, which would let
        # uploads pass locally and then 413 in production only.
        client_max_body_size 12M;

        proxy_pass http://lakeside-taxis-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback: real routes -> index.html (200); unknown paths -> 404 status
    # with the same index.html body (see $spa_known_route above).
    location / {
        try_files $uri $uri/ @spa_fallback;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        sub_filter '</title>' '</title>$home_canonical';
        sub_filter_once on;
    }

    location @spa_fallback {
        if ($spa_known_route) {
            rewrite ^ /index.html last;
        }
        error_page 404 /index.html;
        return 404;
    }
}
